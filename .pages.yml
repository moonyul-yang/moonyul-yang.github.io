# Pages CMS — editing here publishes to the public GitHub repository.
media:
  -
    name: "images"
    label: "사진·로고 (공개 이미지 전용)"
    input: "assets/images"
    output: "/assets/images"
    extensions:
      - "png"
      - "jpg"
      - "jpeg"
      - "webp"
      - "svg"
    rename: "safe"
content:
  -
    name: "profile"
    label: "01 기본 소개·사진"
    type: "file"
    path: "_data/profile.json"
    format: "json"
    fields:
      -
        name: "name"
        label: "영문 이름"
        type: "string"
        required: true
      -
        name: "korean_name"
        label: "한글 이름"
        type: "string"
      -
        name: "status"
        label: "학적·직함"
        type: "string"
        required: true
      -
        name: "university"
        label: "학교"
        type: "string"
      -
        name: "department"
        label: "대학원·학과"
        type: "string"
      -
        name: "rank"
        label: "군 소속·계급"
        type: "string"
      -
        name: "location"
        label: "활동 지역"
        type: "string"
      -
        name: "email"
        label: "공개 이메일"
        type: "string"
        pattern:
          regex: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
          message: "이메일 형식으로 입력하세요."
      -
        name: "github_url"
        label: "GitHub 프로필 주소"
        type: "string"
        pattern: "^https://github\\.com/[A-Za-z0-9-]+/?$"
      -
        name: "portrait"
        label: "프로필 사진"
        type: "image"
        options:
          media: "images"
      -
        name: "tools"
        label: "도구 목록"
        type: "string"
      -
        name: "tools_note"
        label: "도구 설명"
        type: "string"
      -
        name: "page_title"
        label: "브라우저·검색 제목"
        type: "string"
        required: true
      -
        name: "description"
        label: "검색 소개문"
        type: "text"
  -
    name: "about"
    label: "02 소개문·관심 키워드"
    type: "file"
    path: "_data/about.json"
    format: "json"
    fields:
      -
        name: "heading"
        label: "섹션 제목"
        type: "string"
        required: true
      -
        name: "paragraphs"
        label: "소개문 문단"
        type: "text"
        list: true
      -
        name: "current_heading"
        label: "현재 연구 제목"
        type: "string"
      -
        name: "current_research"
        label: "현재 연구 설명"
        type: "text"
      -
        name: "academic_areas"
        label: "학술 영역"
        type: "text"
        description: "키워드 하나씩 줄을 바꾸어 입력하세요."
      -
        name: "methods"
        label: "방법론"
        type: "text"
        description: "키워드 하나씩 줄을 바꾸어 입력하세요."
      -
        name: "regional_interests"
        label: "지역적 관심"
        type: "text"
        description: "지역 하나씩 줄을 바꾸어 입력하세요."
  -
    name: "research"
    label: "03 연구 주제"
